apis:
  - aid: webinarjam:api
    name: WebinarJam API
    description: >-
      REST API for managing WebinarJam live webinars — list all webinars,
      retrieve one webinar's schedules, presenters and custom registration
      fields, register attendees and return their unique room links, page
      through registrants and attendees with attendance and purchase filters,
      and unsubscribe leads. All five operations are POST over TLS and
      authenticate with an account-wide api_key form field obtained after
      approval.
    humanURL: https://support.webinarjam.com/en/collections/19655423-developer-api
    baseURL: https://api.webinarjam.com/webinarjam
    tags:
      - Webinars
      - Live Events
      - Registration
    properties:
      - type: Documentation
        url: https://support.webinarjam.com/en/collections/19655423-developer-api
      - type: APIReference
        url: https://support.webinarjam.com/en/articles/15370142-use-webinarjam-and-everwebinar-apis
      - type: GettingStarted
        url: >-
          https://support.webinarjam.com/en/articles/15370144-connect-to-webinarjam-or-everwebinar-api
  - aid: webinarjam:everwebinar-api
    name: EverWebinar API
    description: >-
      REST API for managing EverWebinar automated and evergreen webinars —
      list webinars, read one webinar's detail, register attendees against a
      specific session date and timezone, list registrants and attendees, and
      unsubscribe leads. Shares the same approval-gated account-wide API key
      as WebinarJam and adds timezone and date parameters on registration.
    humanURL: https://support.webinarjam.com/en/collections/19655423-developer-api
    baseURL: https://api.webinarjam.com/everwebinar
    tags:
