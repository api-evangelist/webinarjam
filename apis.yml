aid: webinarjam
name: WebinarJam
description: >-
  WebinarJam is a live webinar platform for marketing, training, and sales
  events, while its sibling product EverWebinar provides automated and
  evergreen webinar replays. Both are published by Genesis Digital LLC and
  share one REST API that lets integrators list webinars, read webinar detail
  including schedules, presenters and custom registration fields, register
  attendees, pull registrant and attendee analytics, and unsubscribe leads.
  Every operation is a POST carrying a single account-wide 64-character
  api_key form field over TLS, with separate /webinarjam and /everwebinar base
  paths on api.webinarjam.com. API access requires a paid subscription plus an
  application approved by WebinarJam. No OpenAPI, AsyncAPI, MCP server or SDK
  is published; the reference is a human help centre and outbound custom
  webhooks are the only event surface.
