response_headers:
  documented: false
  note: >-
    WebinarJam documents NO rate-limit response headers — no X-RateLimit-*, no RateLimit-*,
    and no Retry-After. An agent therefore has no runtime signal for remaining quota or
    reset time and can only discover the ceiling by being rejected. This is the material
    gap: the number is published, the signal is not.
